service: encryption-service

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    S3_BUCKET: serverless-node-goencrypt
    DYNAMODB_TABLE: FileTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET}
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET}/*

        - Effect: Allow
          Action:
            - dynamodb:BatchGet*
            - dynamodb:DescribeStream
            - dynamodb:DescribeTable
            - dynamodb:Get*
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchWrite*
            - dynamodb:CreateTable
            - dynamodb:Delete*
            - dynamodb:Update*
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:*:*:table/${self:provider.environment.DYNAMODB_TABLE}

functions:
  upload:
    handler: src/components/upload/index.handler
    timeout: 28 # seconds
    memorySize: 128
    events:
      - httpApi:
          path: /upload
          method: post

  encrypt:
    handler: src/components/encryption/index.handler
    timeout: 60 # seconds
    memorySize: 512
    events:
      - s3:
          bucket: ${self:provider.environment.S3_BUCKET}
          event: s3:ObjectCreated:*
          rules:
            - prefix: uploads/
          existing: true

  download:
    handler: src/components/download/index.handler
    timeout: 28 # seconds
    memorySize: 256
    events:
      - httpApi:
          path: /decrypt
          method: post

  decrypt:
    handler: src/components/decryption/index.handler
    timeout: 60 # seconds
    memorySize: 512
    events:
      - s3:
          bucket: ${self:provider.environment.S3_BUCKET}
          event: s3:ObjectCreated:*
          rules:
            - prefix: to_decrypt/
          existing: true

  status:
    handler: src/components/status/index.handler
    timeout: 28 # seconds
    memorySize: 128
    events:
      - httpApi:
          path: /status
          method: get

  update:
    handler: src/components/update/index.handler
    timeout: 28 # seconds
    memorySize: 128
    events:
      - httpApi:
          path: /update
          method: put

resources:
  Resources:
    UploadBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.S3_BUCKET}

    FileStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        AttributeDefinitions:
          - AttributeName: id    
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
